name: iOS Simulator Build for Appetize.io

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x gradlew

    # Pre-compile Kotlin Multiplatform frameworks to prevent build timeout and resolve references early
    - name: Pre-compile Kotlin Multiplatform iOS targets
      run: |
        ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon
        ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon

    # Disable iOS Code Signing to allow compilation on cloud CI runner without Apple Developer Profiles
    - name: Build iOS App with xcodebuild (No Code Sign)
      run: |
        xcodebuild -project iosApp/iosApp.xcodeproj \
                   -scheme iosApp \
                   -sdk iphonesimulator \
                   -configuration Debug \
                   -derivedDataPath build/ios \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   clean build

    - name: Compress iosApp.app to zip
      run: |
        cd build/ios/Build/Products/Debug-iphonesimulator
        zip -r iosApp.app.zip iosApp.app

    - name: Upload iosApp.app.zip to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iosApp-simulator-build
        path: build/ios/Build/Products/Debug-iphonesimulator/iosApp.app.zip
        retention-days: 7
