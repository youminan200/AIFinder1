name: iOS Build (GitHub Actions)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build iOS App
      run: |
        # 1. Build the Kotlin framework first
        ./gradlew :shared:assembleRelease --no-daemon
        
        cd iosApp
        # 2. Build the Xcode project with specific flags to ignore signing and use the right arch
        xcodebuild -project iosApp.xcodeproj \
                   -scheme iosApp \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build \
                   ARCHS=arm64 \
                   ONLY_ACTIVE_ARCH=NO \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   clean build

    - name: Package .ipa
      run: |
        mkdir -p Payload
        cp -r iosApp/build/Build/Products/Release-iphoneos/iosApp.app Payload/
        zip -r iosApp.ipa Payload
        
    - name: Upload iOS IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-ipa
        path: iosApp.ipa
        retention-days: 7
