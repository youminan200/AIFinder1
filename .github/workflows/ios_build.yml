name: iOS Simulator Build for Appetize.io

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build iOS App with xcodebuild
      run: |
        xcodebuild -project iosApp/iosApp.xcodeproj \
                   -scheme iosApp \
                   -sdk iphonesimulator \
                   -configuration Debug \
                   -derivedDataPath build/ios \
                   clean build

    - name: Compress iosApp.app to zip
      run: |
        cd build/ios/Build/Products/Debug-iphonesimulator
        zip -r iosApp.app.zip iosApp.app

    - name: Upload iosApp.app.zip to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iosApp-simulator-build
        path: build/ios/Build/Products/Debug-iphonesimulator/iosApp.app.zip
        retention-days: 7
