name: iOS Build (GitHub Actions)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Kotlin Framework
      run: ./gradlew :shared:assembleRelease --no-daemon

    - name: Build iOS App (Skip Gradle Embedding)
      run: |
        cd iosApp
        # 우리는 이미 위에서 프레임워크를 빌드했으므로, 
        # Xcode가 Gradle을 다시 호출하지 않도록 설정하여 충돌을 피합니다.
        xcodebuild -project iosApp.xcodeproj \
                   -scheme iosApp \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   -destination 'generic/platform=iOS' \
                   clean build

    - name: Package .ipa (Manual)
      run: |
        mkdir -p Payload
        # 빌드된 .app 파일을 Payload 폴더로 복사
        APP_PATH=$(find iosApp/build -name "*.app" | head -n 1)
        cp -r "$APP_PATH" Payload/
        zip -r iosApp.ipa Payload
        
    - name: Upload iOS IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-ipa
        path: iosApp.ipa
        retention-days: 7
